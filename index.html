<style>
/* ━━ クレヨンタッチ デザイン — 西宮ゆたかクリニック ━━ */
@import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');
:root{
  --dg:#D6487A;       /* ローズピンク（メイン） */
  --mg:#F07FAA;       /* ライトローズ */
  --lg:#FFF0F7;       /* 薄ピンク背景 */
  --or:#FF9F43;       /* オレンジ（アクセント） */
  --crm:#FFFCF8;      /* クリーム */
  --gray:#9D7E8A;
  --border:#F5B8D0;
  --light:#FFE8F2;
  --err:#E05575;
  --mint:#52C4A0;
  --sky:#6BC5E8;
  --yellow:#FFD166;
  --r:20px;
  --crayon-shadow:4px 4px 0 var(--border);
  --crayon-shadow-sel:4px 4px 0 var(--dg);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Kosugi Maru','Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN',Meiryo,sans-serif;
  background:linear-gradient(135deg,#FFF0F7 0%,#FFF8F0 50%,#F0F7FF 100%);
  color:#3D2B35;min-height:100vh;padding-bottom:60px;
}

/* ━━ ヘッダー ━━ */
header{
  background:linear-gradient(135deg,#D6487A 0%,#E8628A 60%,#F07FAA 100%);
  color:#fff;padding:16px 16px 12px;text-align:center;
  position:sticky;top:0;z-index:100;
  box-shadow:0 3px 0 #B8325E,0 5px 12px rgba(214,72,122,.35);
}
header h1{font-size:1.1rem;font-weight:700;letter-spacing:.06em;text-shadow:1px 2px 0 rgba(0,0,0,.15)}
header p{font-size:.72rem;opacity:.9;margin-top:3px}

/* プログレスバー */
.pw{background:rgba(255,255,255,.3);height:6px;margin-top:10px;border-radius:3px;overflow:hidden;border:1.5px solid rgba(255,255,255,.4)}
.pb{height:100%;background:linear-gradient(90deg,#FFD166,#FF9F43);border-radius:3px;transition:width .5s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 6px rgba(255,166,0,.7)}

/* ━━ メインコンテナ ━━ */
.wrap{max-width:680px;margin:0 auto;padding:22px 16px}

/* ━━ カード（クレヨン風） ━━ */
.card{
  background:#fff;
  border:2.5px solid var(--border);
  border-radius:var(--r);
  padding:26px 22px;
  margin-bottom:16px;
  box-shadow:var(--crayon-shadow),7px 7px 0 var(--light);
  position:relative;
}
.card::before{
  content:'';position:absolute;top:-1px;left:16px;right:16px;height:3px;
  background:linear-gradient(90deg,var(--dg),var(--or),var(--sky),var(--mint));
  border-radius:0 0 4px 4px;opacity:.6;
}

/* ━━ ステップラベル・タイトル ━━ */
.sl{
  font-size:.7rem;font-weight:700;color:var(--mg);
  letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px;
  display:inline-flex;align-items:center;gap:6px;
}
.sl::before{content:'✏️';font-size:.8rem}
.st{font-size:1.18rem;font-weight:700;color:var(--dg);margin-bottom:18px;line-height:1.4}

/* ━━ 診療科カード ━━ */
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.dc{
  border:2.5px solid var(--border);border-radius:var(--r);
  padding:18px 12px;cursor:pointer;text-align:center;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
  background:var(--crm);
  box-shadow:var(--crayon-shadow);
}
.dc:hover{
  border-color:var(--mg);background:var(--lg);
  transform:translate(-2px,-2px);
  box-shadow:6px 6px 0 var(--border);
}
.dc.sel{
  border-color:var(--dg);background:var(--lg);
  box-shadow:var(--crayon-shadow-sel);
  transform:translate(-2px,-2px);
}
.dc .ic{font-size:2.2rem;margin-bottom:7px}
.dc .nm{font-size:.95rem;font-weight:700;color:var(--dg)}
.dc .ds{font-size:.7rem;color:var(--gray);margin-top:4px;line-height:1.4}

/* ━━ フォームフィールド ━━ */
.fg{margin-bottom:18px}
.fg:last-child{margin-bottom:0}
label{display:block;font-size:.85rem;font-weight:700;color:#3D2B35;margin-bottom:6px}
.req::after{
  content:'必須';font-size:.62rem;
  background:var(--light);color:var(--dg);
  padding:1px 6px;border-radius:20px;margin-left:6px;
  font-weight:700;border:1px solid var(--border);
}
input[type=text],input[type=date],input[type=tel],select,textarea{
  width:100%;padding:11px 14px;
  border:2px solid var(--border);
  border-radius:12px;
  font-size:1rem;font-family:inherit;
  background:var(--crm);
  transition:all .2s;
  box-shadow:2px 2px 0 var(--light);
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:var(--dg);
  box-shadow:3px 3px 0 var(--light),0 0 0 3px rgba(214,72,122,.12);
  background:#fff;
}
textarea{resize:vertical;min-height:80px}

/* ━━ ラジオ・チェックボックス ━━ */
.rg,.cg{display:flex;flex-direction:column;gap:8px}
.rg.h,.cg.h{flex-direction:row;flex-wrap:wrap}
.ri,.ci{
  display:flex;align-items:center;gap:9px;
  padding:10px 14px;
  border:2px solid var(--border);border-radius:12px;
  cursor:pointer;font-size:.88rem;
  transition:all .15s cubic-bezier(.34,1.56,.64,1);
  background:var(--crm);user-select:none;
  box-shadow:2px 2px 0 var(--light);
}
.ri:hover,.ci:hover{
  border-color:var(--mg);background:var(--lg);
  transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--border);
}
.ri.sel,.ci.sel{
  border-color:var(--dg);background:var(--lg);
  color:var(--dg);font-weight:700;
  box-shadow:var(--crayon-shadow-sel);
  transform:translate(-2px,-2px);
}
.dot,.box{
  width:18px;height:18px;
  border:2px solid var(--border);border-radius:50%;
  flex-shrink:0;display:flex;align-items:center;
  justify-content:center;transition:all .15s;background:#fff;
}
.box{border-radius:5px}
.ri.sel .dot{border-color:var(--dg);background:var(--dg)}
.ri.sel .dot::after{content:'';width:6px;height:6px;background:#fff;border-radius:50%}
.ci.sel .box{border-color:var(--dg);background:var(--dg)}
.ci.sel .box::after{content:'✓';color:#fff;font-size:11px;font-weight:700}

/* ━━ 区切り・サブヘッダー ━━ */
.div{
  border:none;margin:20px 0;
  background:repeating-linear-gradient(90deg,var(--border) 0,var(--border) 6px,transparent 6px,transparent 12px);
  height:2px;border-radius:1px;
}
.sub{
  font-size:.8rem;font-weight:700;color:var(--dg);
  margin-bottom:12px;padding:6px 12px;
  background:var(--lg);border-radius:20px;
  border:1.5px solid var(--border);
  display:inline-block;
}

/* ━━ ボタン ━━ */
.btn-row{display:flex;gap:10px;margin-top:24px}
.btn{
  padding:13px 24px;border-radius:var(--r);
  font-size:.95rem;font-weight:700;
  cursor:pointer;border:none;
  transition:all .15s cubic-bezier(.34,1.56,.64,1);flex:1;
  font-family:inherit;
}
.bp{
  background:var(--dg);color:#fff;
  border:2.5px solid #B8325E;
  box-shadow:4px 4px 0 #B8325E;
}
.bp:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #B8325E}
.bp:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #B8325E}
.bs{
  background:var(--crm);color:var(--dg);
  border:2.5px solid var(--border);
  box-shadow:4px 4px 0 var(--light);
}
.bs:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--border);background:var(--lg)}
.bs:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--border)}
.bsend{
  background:var(--or);color:#fff;
  border:2.5px solid #D4820A;
  box-shadow:4px 4px 0 #D4820A;
}
.bsend:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #D4820A}

/* ━━ アラート ━━ */
.alert-box{
  background:#FFF8F0;
  border:2px solid #FFCF8A;
  border-radius:var(--r);
  padding:13px 16px;margin-bottom:18px;
  font-size:.83rem;color:#7A4A00;
  box-shadow:3px 3px 0 #FFE0A0;
}
.alert-box strong{display:block;margin-bottom:3px;font-size:.88rem}

/* ━━ エラー ━━ */
.emsg{font-size:.73rem;color:var(--err);margin-top:4px;display:none}
.has-err input,.has-err select,.has-err textarea{border-color:var(--err);box-shadow:2px 2px 0 #FFD0D8}
.has-err .emsg{display:block}
.verr{font-size:.73rem;color:var(--err);margin-top:5px;display:none}

/* ━━ 確認画面 ━━ */
.ss{margin-bottom:18px}
.ss h3{
  font-size:.82rem;font-weight:700;color:var(--dg);
  background:var(--lg);padding:6px 13px;
  border-radius:20px;margin-bottom:10px;
  border:1.5px solid var(--border);
  display:inline-flex;align-items:center;gap:5px;
}
.sr{display:flex;gap:10px;padding:7px 4px;border-bottom:1.5px dashed var(--light);font-size:.86rem}
.sk{color:var(--gray);width:110px;flex-shrink:0;font-size:.8rem}
.sv{font-weight:600}

/* ━━ 完了画面 ━━ */
.done-i{font-size:3rem;text-align:center;margin-bottom:10px;animation:bounce .6s ease}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.done-m{text-align:center;font-size:1.15rem;font-weight:700;color:var(--dg);margin-bottom:8px}
.done-s{text-align:center;font-size:.83rem;color:var(--gray);line-height:1.8;margin-bottom:18px}

/* ━━ レスポンシブ ━━ */
@media(max-width:480px){
  .card{padding:18px 14px}
  .dgrid{grid-template-columns:1fr 1fr}
  .btn-row{flex-direction:column-reverse}
  .sk{width:90px}
}

/* ━━ 印刷ビュー（印刷時のみ変更なし） ━━ */
.pv-wrap{font-family:'Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,Arial,sans-serif;font-size:11pt;color:#111;max-width:760px;margin:0 auto;padding:24px 20px;background:#fff}
.pv-header{text-align:center;border-bottom:2.5px solid #D6487A;padding-bottom:10px;margin-bottom:16px}
.pv-header h1{font-size:1.3rem;font-weight:700;color:#D6487A;margin:0 0 3px}
.pv-header p{font-size:.8rem;color:#555;margin:0}
.pv-meta{display:flex;justify-content:space-between;font-size:.78rem;color:#555;margin-bottom:14px;border-bottom:1px solid #ccc;padding-bottom:8px}
.pv-section{margin-bottom:14px;break-inside:avoid}
.pv-section h2{font-size:.88rem;font-weight:700;background:#FFF0F7;color:#D6487A;padding:4px 10px;margin:0 0 4px;border-left:3px solid #D6487A}
.pv-row{display:flex;border-bottom:1px solid #eee;padding:4px 8px;font-size:.88rem}
.pv-key{color:#555;width:120px;flex-shrink:0;font-size:.82rem}
.pv-val{font-weight:500;flex:1}
.pv-footer{text-align:center;font-size:.72rem;color:#888;margin-top:18px;border-top:1px solid #ccc;padding-top:8px}
.pv-printbtn{display:block;margin:16px auto 0;padding:10px 28px;background:#D6487A;color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer}
@media print{
  header,.pw,.btn-row,#app,.pv-printbtn{display:none!important}
  #ps{display:block!important}
  body{background:#fff;margin:0;padding:0}
  .pv-wrap{padding:0;max-width:100%}
}
#ps{display:none}

/* ━━ Markdown 表示 ━━ */
.md-body{line-height:1.8;font-size:.95rem}
.md-body h1,.md-body h2,.md-body h3{color:var(--dg);margin:1em 0 .5em}
.md-body p,.md-body ul,.md-body ol,.md-body blockquote,.md-body table,.md-body pre{margin:.6em 0}
.md-body ul,.md-body ol{padding-left:1.5em}
.md-body a{color:var(--dg)}
.md-body blockquote{border-left:4px solid var(--border);padding:.2em .8em;color:var(--gray);background:var(--lg);border-radius:0 8px 8px 0}
.md-body code{background:var(--light);padding:.1em .4em;border-radius:4px;font-size:.9em}
.md-body pre{background:var(--light);padding:10px;border-radius:8px;overflow-x:auto}
.md-body pre code{background:none;padding:0}
.md-body table{border-collapse:collapse;width:100%}
.md-body th,.md-body td{border:1px solid var(--border);padding:4px 8px}
.md-body th{background:var(--lg)}
</style>

<!-- Markdown 表示用ライブラリ（marked: Markdown→HTML変換 / DOMPurify: 安全化） -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script>
// Markdown テキストを安全な HTML 文字列に変換
function md(text){
  if(!window.marked||!window.DOMPurify) return String(text==null?'':text).replace(/[&<>"']/g,function(c){return '&#'+c.charCodeAt(0)+';';});
  return DOMPurify.sanitize(marked.parse(String(text==null?'':text),{breaks:true}));
}
// data-md 属性を持つ要素の中身を Markdown として描画
function renderMarkdown(root){
  (root||document).querySelectorAll('[data-md]:not([data-md-done])').forEach(function(el){
    el.innerHTML=md(el.textContent);
    el.classList.add('md-body');
    el.setAttribute('data-md-done','');
  });
}
document.addEventListener('DOMContentLoaded',function(){
  renderMarkdown();
  new MutationObserver(function(){renderMarkdown();}).observe(document.body,{childList:true,subtree:true});
});
</script>

function calcAge(dob){
  if(!dob) return '—';
  var t=new Date(), b=new Date(dob);
  var a=t.getFullYear()-b.getFullYear();
  if(t.getMonth()-b.getMonth()<0||(t.getMonth()===b.getMonth()&&t.getDate()<b.getDate())) a--;
  return a+'歳';
}

function initR(cls, cb){
  var els = document.querySelectorAll('.'+cls+' .ri');
  for(var i=0;i<els.length;i++){
    (function(el){
      el.addEventListener('click', function(){
        var all=document.querySelectorAll('.'+cls+' .ri');
        for(var j=0;j<all.length;j++) all[j].classList.remove('sel');
        el.classList.add('sel');
        if(cb) cb(el.getAttribute('data-v'));
      });
    })(els[i]);
  }
}

function addrBlock(b){
  return '<div class="fg">'
    +'<label class="req">郵便番号</label>'
    +'<div style="display:flex;gap:8px;align-items:center;">'
    +'<input type="tel" id="zip" value="'+(b.zip||'')+'" placeholder="例）663-8501" maxlength="8" style="max-width:160px;">'
    +'<button type="button" id="zipBtn" style="padding:9px 14px;border:none;border-radius:8px;background:var(--dg);color:#fff;font-size:.83rem;font-weight:700;cursor:pointer;white-space:nowrap;">住所を検索</button>'
    +'<span id="zipMsg" style="font-size:.75rem;color:var(--gray);"></span>'
    +'</div></div>'
    +'<div class="fg"><label class="req">ご住所</label>'
    +'<input type="text" id="addrAuto" value="'+(b.addrAuto||'')+'" placeholder="都道府県・市区町村（郵便番号検索で自動入力）" readonly style="background:#F3F4F6;color:#374151;">'
    +'<div class="emsg"></div></div>'
    +'<div class="fg"><label>番地・建物名</label>'
    +'<input type="text" id="addr" value="'+(b.address||'')+'" placeholder="例）1丁目2-3 △△マンション101号">'
    +'<div class="emsg"></div></div>';
}
function bindZip(){
  var zipEl=ge('zip'), btn=ge('zipBtn'), msg=ge('zipMsg'), autoEl=ge('addrAuto');
  if(!zipEl||!btn||!autoEl) return;
  function doSearch(){
    var raw=zipEl.value.replace(/-/g,'').replace(/[^\d]/g,'');
    if(raw.length!==7){msg.textContent='7桁で入力してください';msg.style.color='var(--err)';return;}
    msg.textContent='検索中…';msg.style.color='var(--gray)';btn.disabled=true;
    fetch('https://zipcloud.ibsnet.co.jp/api/search?zipcode='+raw)
      .then(function(r){return r.json();})
      .then(function(d){
        btn.disabled=false;
        if(d.results&&d.results[0]){
          var r=d.results[0];
          autoEl.value=r.address1+r.address2+r.address3;
          msg.textContent='✓ 自動入力されました';msg.style.color='#16A34A';
        } else {
          msg.textContent='住所が見つかりませんでした';msg.style.color='var(--err)';
        }
      })
      .catch(function(){btn.disabled=false;msg.textContent='通信エラー';msg.style.color='var(--err)';});
  }
  btn.onclick=doSearch;
  zipEl.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doSearch();}});
  zipEl.addEventListener('input',function(){
    var v=zipEl.value.replace(/[^\d]/g,'');
    if(v.length>3) zipEl.value=v.slice(0,3)+'-'+v.slice(3,7);
    else zipEl.value=v;
  });
}

function buildBody(){

    : S.cc.map(function(v){ var f=COMPLAINTS[S.dept]||[]; for(var i=0;i<f.length;i++) if(f[i].v===v) return f[i].l; return v; }).join('、');

  if(isShoni){ t+='お子様のお名前：'+b.childName+(b.childKana?'（'+b.childKana+'）':'')+'\n生年月日：'+b.childDob+'（'+calcAge(b.childDob)+'）\n'; if(isFirst) t+='性別：'+(SEX_LBL_C[b.sex]||'')+'\n保護者：'+g.name+'（'+g.relation+'）\n'; }
  else { t+='お名前：'+b.name+(b.kana?'（'+b.kana+'）':'')+'\n生年月日：'+b.dob+'（'+calcAge(b.dob)+'）\n'; if(isFirst) t+='性別：'+(SEX_LBL[b.sex]||'')+'\n'; }
  if(isFirst) t+='電話番号：'+b.tel+'\nご住所：'+b.address+'\n';
  t+='初診・再診：'+VISIT_LBL[b.visit]+'\n\n';

    t+='■ '+(isVitc?'今回の目的':'ご希望メニュー')+'\n'+ccL+'\n';

  } else {
    t+='■ 症状\n主訴：'+ccL+'\n症状の始まり：'+(ONSET_LBL[sy.onset]||'—')+'\n症状の経過：'+(COURSE_LBL[sy.course]||'—')+'\n';

    t+='\n■ 生活習慣\n';
    if(inf.alc) t+='飲酒：'+({none:'飲まない',some:'たまに飲む',daily:'毎日飲む'}[inf.alc]||inf.alc)+(inf.alcAmt?' （'+inf.alcAmt+'）':'')+'\n';

function done(){
  var b=S.basic, isShoni=S.dept==='shoni';

  var subj='【問診票】'+DEPT_LBL[S.dept]+'　'+(pt||'')+'様';
  var printUrl=buildPrintUrl();
  var body=buildBody()+'\n\n'
    +'━━━━━━━━━━━━━━━━━━━━━━━\n'
    +'🖨️ 印刷用リンク（クリックで即印刷）\n'
    +printUrl+'\n'
    +'━━━━━━━━━━━━━━━━━━━━━━━';
  var now=new Date();
  var ds=now.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
  var ts=now.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
  function showDone(sent){
    render('<div class="card">'
      +'<div class="done-i">'+(sent?'&#x2705;':'&#x1F4CB;')+'</div>'
      +'<div class="done-m">'+(sent?'送信が完了しました':'問診票の入力が完了しました')+'</div>'
      +'<div class="done-s">'+ds+' '+ts+'<br>'+(sent?'問診内容をクリニックへ送信しました。受付にてお声がけください。':'下のボタンで問診内容を送信してください。')+'</div>'
      +(sent?'':'<div class="btn-row" style="flex-direction:column;gap:10px;">'
        +'<button class="btn bsend" id="sendBtn">&#x1F4E4; 送信する</button>'
        +'</div>')
      +'<div class="btn-row" style="flex-direction:column;gap:10px;margin-top:10px;">'
      +(sent?'<button class="btn bp" id="printBtn" style="background:#16A34A;">&#x1F5A8; 印刷する</button>':'')
      +'<button class="btn bs" onclick="location.reload()">最初からやり直す</button>'
      +'</div></div>'
      +'<div class="card" style="background:var(--lg);border:1.5px solid var(--mg);">'
      +'<p style="font-size:.8rem;color:var(--dg);text-align:center;line-height:1.9;">&#x1FA7A; <strong>西宮ゆたかクリニック</strong><br>内科 ／ 循環器内科 ／ 小児科</p></div>');
    if(!sent){
      ge('sendBtn').onclick=function(){
        var mailUrl='mailto:'+MAIL_TO
          +'?subject='+encodeURIComponent(subj)
          +'&body='+encodeURIComponent(body);
        window.location.href=mailUrl;
        setTimeout(function(){ showDone(true); }, 800);
      };
    }
    if(sent && ge('printBtn')){
      ge('printBtn').onclick=function(){ showPrintView(); };
    }
  }
  showDone(false);
}

function buildPrintUrl(){

    return location.origin+location.pathname+'#pv='+enc;
  }catch(e){return '';}
}
